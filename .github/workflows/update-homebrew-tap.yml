name: Update Stax Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to use (e.g., v2.14.1)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            echo "No tag specified and not a release event"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG}, version: ${VERSION}"

      - name: Get release checksums from stax-public
        id: get_checksums
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_tag.outputs.version }}"

          # Download checksums from public mirror
          curl -sL "https://github.com/Firecrown-Media/stax-public/releases/download/${TAG}/checksums.txt" > checksums.txt

          # Extract checksums for each platform
          DARWIN_ARM64_SHA=$(grep "Darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')
          DARWIN_AMD64_SHA=$(grep "Darwin_x86_64.tar.gz" checksums.txt | awk '{print $1}')
          LINUX_ARM64_SHA=$(grep "Linux_arm64.tar.gz" checksums.txt | awk '{print $1}')
          LINUX_AMD64_SHA=$(grep "Linux_x86_64.tar.gz" checksums.txt | awk '{print $1}')

          echo "darwin_arm64_sha=${DARWIN_ARM64_SHA}" >> $GITHUB_OUTPUT
          echo "darwin_amd64_sha=${DARWIN_AMD64_SHA}" >> $GITHUB_OUTPUT
          echo "linux_arm64_sha=${LINUX_ARM64_SHA}" >> $GITHUB_OUTPUT
          echo "linux_amd64_sha=${LINUX_AMD64_SHA}" >> $GITHUB_OUTPUT

          echo "Checksums for ${TAG}:"
          cat checksums.txt

      - name: Checkout homebrew-stax repository
        uses: actions/checkout@v4
        with:
          repository: Firecrown-Media/homebrew-stax
          token: ${{ secrets.PAT }}
          path: homebrew-stax

      - name: Update Homebrew Formula
        run: |
          cd homebrew-stax
          mkdir -p Formula

          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_tag.outputs.version }}"

          cat > Formula/stax.rb << 'FORMULA_EOF'
class Stax < Formula
  desc "CLI tool for web development with DDEV and WordPress"
  homepage "https://github.com/Firecrown-Media/stax-public"
  version "${{ steps.get_tag.outputs.version }}"
  license "MIT"

  on_macos do
    if Hardware::CPU.arm?
      url "https://github.com/Firecrown-Media/stax-public/releases/download/${{ steps.get_tag.outputs.tag }}/stax-public_${{ steps.get_tag.outputs.version }}_Darwin_arm64.tar.gz"
      sha256 "${{ steps.get_checksums.outputs.darwin_arm64_sha }}"
    end
    if Hardware::CPU.intel?
      url "https://github.com/Firecrown-Media/stax-public/releases/download/${{ steps.get_tag.outputs.tag }}/stax-public_${{ steps.get_tag.outputs.version }}_Darwin_x86_64.tar.gz"
      sha256 "${{ steps.get_checksums.outputs.darwin_amd64_sha }}"
    end
  end

  on_linux do
    if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
      url "https://github.com/Firecrown-Media/stax-public/releases/download/${{ steps.get_tag.outputs.tag }}/stax-public_${{ steps.get_tag.outputs.version }}_Linux_arm64.tar.gz"
      sha256 "${{ steps.get_checksums.outputs.linux_arm64_sha }}"
    end
    if Hardware::CPU.intel?
      url "https://github.com/Firecrown-Media/stax-public/releases/download/${{ steps.get_tag.outputs.tag }}/stax-public_${{ steps.get_tag.outputs.version }}_Linux_x86_64.tar.gz"
      sha256 "${{ steps.get_checksums.outputs.linux_amd64_sha }}"
    end
  end

  def install
    bin.install "stax"
  end

  test do
    system "#{bin}/stax", "--version"
  end
end
FORMULA_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/stax.rb
          git commit -m "stax: update to ${VERSION}"
          git push
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.PAT }}

      - name: Summary
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_tag.outputs.version }}"

          echo "## Homebrew Formula Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully updated Homebrew formula to **${VERSION}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: [stax-public](https://github.com/Firecrown-Media/stax-public)" >> $GITHUB_STEP_SUMMARY
          echo "- Formula: [firecrown-media/stax](https://github.com/Firecrown-Media/homebrew-stax)" >> $GITHUB_STEP_SUMMARY
